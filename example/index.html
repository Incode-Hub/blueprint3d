<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Blueprint 3D - Example (Responsive Sidebar)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap + your existing styles -->
    <link href="css/bootstrap.css" rel="stylesheet">
    <link href="css/example.css" rel="stylesheet">

    <!-- Libraries (order matters) -->
    <script src="js/three.min.js"></script>
    <script src="js/blueprint3d.js"></script>

    <!-- Universal loader + scene patch (new) -->
    <script src="js/model-loader.js"></script>
    <script src="js/scene-patch.js"></script>

    <script src="js/jquery.js"></script>
    <script src="js/bootstrap.js"></script>

    <!-- Optional: PDF helpers (unchanged) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="js/items.js"></script>
    <script src="js/pdfexport.js"></script>
  </head>

  <body>
    <!-- Mobile: hamburger + backdrop for off-canvas sidebar -->
    <button id="sidebar-toggle"
            class="btn btn-primary btn-sm visible-xs-inline-block"
            style="position:fixed;top:10px;left:10px;z-index:2001">
      <span class="glyphicon glyphicon-menu-hamburger"></span>
    </button>
    <div id="sidebar-backdrop" class="hidden-xs"></div>

    <div class="container-fluid">
      <div class="row main-row">
        <!-- Left Column (responsive / off-canvas on phones) -->
        <div id="sidebar" class="col-xs-12 col-sm-4 col-md-3 sidebar">
          <!-- Main Navigation -->
          <ul class="nav nav-sidebar">
            <li id="floorplan_tab" class="active">
              <a href="#">Edit Floorplan <span class="glyphicon glyphicon-chevron-right pull-right"></span></a>
            </li>
            <li id="design_tab">
              <a href="#">Design <span class="glyphicon glyphicon-chevron-right pull-right"></span></a>
            </li>
            <li id="items_tab">
              <a href="#">Add Items <span class="glyphicon glyphicon-chevron-right pull-right"></span></a>
            </li>
          </ul>
          <hr />

          <!-- (Optional) PDF Export Section -->
          <div id="pdf-export-section" style="margin-bottom:20px;">
            <h5 class="text-center" style="margin-bottom: 15px; color: #666;">
              <span class="glyphicon glyphicon-print"></span> Export PDF
            </h5>
            <button class="btn btn-success btn-sm btn-block" id="export-items-list">
              <span class="glyphicon glyphicon-download-alt"></span> Download Items List
            </button>
            <button class="btn btn-warning btn-xs btn-block" id="clear-selected-items" style="margin-top:6px;">
              <span class="glyphicon glyphicon-refresh"></span> Clear Selection
            </button>
            <div id="pdf-status" class="alert" style="display:none; margin-top:10px; padding:8px; font-size:11px;"></div>
          </div>
          <hr />

          <!-- Context Menu -->
          <div id="context-menu" style="display:none;">
            <div style="margin: 0 20px">
              <span id="context-menu-name" class="lead"></span>
              <br /><br />
              <button class="btn btn-block btn-danger" id="context-menu-delete">
                <span class="glyphicon glyphicon-trash"></span> Delete Item
              </button>
              <br />
              <!-- <div class="panel panel-default">
                <div class="panel-heading">Adjust Size</div>
                <div class="panel-body" style="color:#333;">
                  <div class="form form-horizontal">
                    <div class="form-group">
                      <label class="col-sm-5 control-label">Width</label>
                      <div class="col-sm-6"><input type="number" class="form-control" id="item-width"></div>
                    </div>
                    <div class="form-group">
                      <label class="col-sm-5 control-label">Depth</label>
                      <div class="col-sm-6"><input type="number" class="form-control" id="item-depth"></div>
                    </div>
                    <div class="form-group">
                      <label class="col-sm-5 control-label">Height</label>
                      <div class="col-sm-6"><input type="number" class="form-control" id="item-height"></div>
                    </div>
                  </div>
                  <small><span class="text-muted">Measurements in inches.</span></small>
                </div>
              </div> -->

              <!-- <label><input type="checkbox" id="fixed" /> Lock in place</label> -->
              <br /><br />
            </div>
          </div>

          <!-- Floor textures -->
          <div id="floorTexturesDiv" style="display:none; padding: 0 20px">
            <div class="panel panel-default">
              <div class="panel-heading">Adjust Floor</div>
              <div class="panel-body" style="color:#333;">
                <div class="col-sm-6" style="padding:3px">
                  <a href="#" class="thumbnail texture-select-thumbnail"
                     texture-url="rooms/textures/light_fine_wood.jpg" texture-stretch="false" texture-scale="300">
                    <img alt="Thumb light fine wood" src="rooms/thumbnails/thumbnail_light_fine_wood.jpg" />
                  </a>
                </div>
              </div>
            </div>
          </div>

          <!-- Wall textures -->
          <div id="wallTextures" style="display:none; padding: 0 20px">
            <div class="panel panel-default">
              <div class="panel-heading">Adjust Wall</div>
              <div class="panel-body" style="color:#333;">
                <div class="col-sm-6" style="padding:3px">
                  <a href="#" class="thumbnail texture-select-thumbnail"
                     texture-url="rooms/textures/marbletiles.jpg" texture-stretch="false" texture-scale="300">
                    <img alt="Thumb marbletiles" src="rooms/thumbnails/thumbnail_marbletiles.jpg" />
                  </a>
                </div>
                <div class="col-sm-6" style="padding:3px">
                  <a href="#" class="thumbnail texture-select-thumbnail"
                     texture-url="rooms/textures/wallmap_yellow.png" texture-stretch="true" texture-scale="">
                    <img alt="Thumb yellow" src="rooms/thumbnails/thumbnail_wallmap_yellow.png" />
                  </a>
                </div>
                <div class="col-sm-6" style="padding:3px">
                  <a href="#" class="thumbnail texture-select-thumbnail"
                     texture-url="rooms/textures/light_brick.jpg" texture-stretch="false" texture-scale="100">
                    <img alt="Thumb brick" src="rooms/thumbnails/thumbnail_light_brick.jpg" />
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Column -->
        <div class="col-xs-12 col-sm-8 col-md-9 main">

          <!-- 3D Viewer -->
          <div id="viewer">
            <!-- Top-left file actions -->
            <div id="main-controls">
              <a href="#" class="btn btn-default btn-sm" id="new">New Plan</a>
              <a href="#" class="btn btn-default btn-sm" id="saveFile">Save Plan</a>
              <a class="btn btn-sm btn-default btn-file">
                <input type="file" class="hidden-input" id="loadFile"> Load Plan
              </a>
            </div>

            <!-- Bottom-right camera buttons -->
            <div id="camera-controls">
              <a href="#" class="btn btn-default bottom" id="zoom-out">
                <span class="glyphicon glyphicon-zoom-out"></span>
              </a>
              <a href="#" class="btn btn-default bottom" id="reset-view">
                <span class="glyphicon glyphicon-home"></span>
              </a>
              <a href="#" class="btn btn-default bottom" id="zoom-in">
                <span class="glyphicon glyphicon-zoom-in"></span>
              </a>
              <span>&nbsp;</span>
              <a class="btn btn-default bottom" href="#" id="move-left"><span class="glyphicon glyphicon-arrow-left"></span></a>
              <span class="btn-group-vertical">
                <a class="btn btn-default" href="#" id="move-up"><span class="glyphicon glyphicon-arrow-up"></span></a>
                <a class="btn btn-default" href="#" id="move-down"><span class="glyphicon glyphicon-arrow-down"></span></a>
              </span>
              <a class="btn btn-default bottom" href="#" id="move-right"><span class="glyphicon glyphicon-arrow-right"></span></a>
            </div>

            <!-- Loading overlay -->
            <div id="loading-modal"><h1>Loading...</h1></div>

            <!-- === MOBILE ARROWS (inside #viewer) === -->
            <div id="mobile-item-controls" aria-hidden="false">
              <div class="mic-grid">
                <button class="mic-btn mic-move" data-dx="0" data-dz="-1" aria-label="Move up">▲</button>
                <div class="mic-rot-wrap">
                  <button class="mic-btn mic-rot" data-deg="-5" aria-label="Rotate left">⟲</button>
                  <button class="mic-btn mic-rot" data-deg="5" aria-label="Rotate right">⟳</button>
                </div>
                <button class="mic-btn mic-move" data-dx="0" data-dz="1" aria-label="Move down">▼</button>

                <button class="mic-btn mic-move" data-dx="-1" data-dz="0" aria-label="Move left">◀</button>
                <button class="mic-btn mic-step" id="mic-step">5cm</button>
                <button class="mic-btn mic-move" data-dx="1" data-dz="0" aria-label="Move right">▶</button>
              </div>
            </div>
          </div>

          <!-- 2D Floorplanner -->
          <div id="floorplanner">
            <canvas id="floorplanner-canvas"></canvas>
            <div id="floorplanner-controls" style="position:absolute; left:0; top:0; margin:20px 0; padding:0 20px; width:100%;">
              <button id="move" class="btn btn-sm btn-default"><span class="glyphicon glyphicon-move"></span> Move Walls</button>
              <button id="draw" class="btn btn-sm btn-default"><span class="glyphicon glyphicon-pencil"></span> Draw Walls</button>
              <button id="delete" class="btn btn-sm btn-default"><span class="glyphicon glyphicon-remove"></span> Delete Walls</button>
              <span class="pull-right"><button class="btn btn-primary btn-sm done_btn" id="update-floorplan">Done &raquo;</button></span>
            </div>
            <div id="draw-walls-hint" style="position:absolute; left:20px; bottom:20px; background:rgba(0,0,0,.5); color:#fff; padding:5px 10px; display:none;">
              Press the "Esc" key to stop drawing walls
            </div>
          </div>

          <!-- Add Items -->
          <div id="add-items">
            <div class="row" id="items-wrapper">
              <!-- Items added by items.js -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Optional PDF Loading Modal -->
    <div id="pdf-loading-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:9999;">
      <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; color:#fff;">
        <div class="spinner" style="border:4px solid #f3f3f3; border-top:4px solid #3498db; border-radius:50%; width:40px; height:40px; animation: spin 2s linear infinite; margin:0 auto 20px;"></div>
        <h3 id="pdf-loading-message">Generating PDF...</h3>
        <p>Please wait while we process your request.</p>
      </div>
    </div>

    <script src="js/example.js"></script>
  </body>
</html>
