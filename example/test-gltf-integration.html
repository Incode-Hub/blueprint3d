<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GLTF Integration Test - Blueprint3D</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        #viewport {
            width: 100%;
            height: 500px;
            background: #222;
            position: relative;
        }
        #controls {
            padding: 20px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .model-button {
            margin: 5px;
            padding: 10px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .model-button:hover {
            background: #45a049;
        }
        .model-button.gltf {
            background: #2196F3;
        }
        .model-button.gltf:hover {
            background: #1976D2;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 4px;
        }
        .category {
            margin: 15px 0;
        }
        .category h3 {
            margin: 0 0 10px 0;
            color: #333;
        }
    </style>

    <!-- Three.js and loaders -->
    <script src="js/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="js/model-loader.js"></script>
</head>
<body>
    <div id="controls">
        <h2>GLTF vs JS Model Integration Test</h2>

        <div class="category">
            <h3>Kepler Basin 70 - Comparison</h3>
            <button class="model-button" onclick="loadModel('models/js/Kepler Basin 70.js')">Load JS Version</button>
            <button class="model-button gltf" onclick="loadModel('gltf/Kepler Basin 70.gltf')">Load GLTF Version</button>
        </div>

        <div class="category">
            <h3>Kepler Basin 70 Pedestal - Comparison</h3>
            <button class="model-button" onclick="loadModel('models/js/Kepler Basin 70 Pedestal.js')">Load JS Version</button>
            <button class="model-button gltf" onclick="loadModel('gltf/Kepler Basin 70 Pedestal.gltf')">Load GLTF Version</button>
        </div>

        <div class="category">
            <h3>Kepler Basin 70 Half Pedestal - Comparison</h3>
            <button class="model-button" onclick="loadModel('models/js/Kepler Basin 70 Half Pedestal.js')">Load JS Version</button>
            <button class="model-button gltf" onclick="loadModel('gltf/Kepler Basin 70 Half Pedestal.gltf')">Load GLTF Version</button>
        </div>

        <div class="category">
            <h3>Kepler Toilet Floor Standing - Comparison</h3>
            <button class="model-button" onclick="loadModel('models/js/Kepler Toilet Floor Standing.js')">Load JS Version</button>
            <button class="model-button gltf" onclick="loadModel('gltf/Kepler Toilet Floor Standing.gltf')">Load GLTF Version</button>
        </div>
    </div>

    <div id="viewport">
        <div id="info">Click a button to load a model. Green = JS format, Blue = GLTF format</div>
    </div>

    <script>
        var scene, camera, renderer;
        var currentModel = null;

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / 500,
                0.1,
                1000
            );
            camera.position.set(5, 5, 5);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, 500);
            renderer.shadowMap.enabled = true;
            document.getElementById('viewport').appendChild(renderer.domElement);

            // Lights
            var ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            var directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight.position.set(10, 10, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Grid helper
            var gridHelper = new THREE.GridHelper(10, 10);
            scene.add(gridHelper);

            // Simple orbit controls
            var mouseDown = false;
            var mouseX = 0, mouseY = 0;

            renderer.domElement.addEventListener('mousedown', function(e) {
                mouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            renderer.domElement.addEventListener('mouseup', function() {
                mouseDown = false;
            });

            renderer.domElement.addEventListener('mousemove', function(e) {
                if (!mouseDown) return;

                var deltaX = e.clientX - mouseX;
                var deltaY = e.clientY - mouseY;

                // Rotate camera around origin
                var spherical = new THREE.Spherical();
                spherical.setFromVector3(camera.position);
                spherical.theta -= deltaX * 0.01;
                spherical.phi += deltaY * 0.01;
                spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
                camera.position.setFromSpherical(spherical);
                camera.lookAt(0, 0, 0);

                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            // Mouse wheel zoom
            renderer.domElement.addEventListener('wheel', function(e) {
                e.preventDefault();
                var scale = e.deltaY > 0 ? 1.1 : 0.9;
                camera.position.multiplyScalar(scale);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function loadModel(url) {
            var info = document.getElementById('info');
            var filename = url.split('/').pop();
            var format = url.includes('.gltf') ? 'GLTF' : 'JS';
            info.textContent = 'Loading ' + format + ': ' + filename;

            // Remove current model
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }

            var startTime = Date.now();

            // Load new model
            ModelLoader.loadModelWithOverlay(url, scene, {
                onStart: function() {
                    console.log('Started loading:', url);
                },
                onSuccess: function(object) {
                    currentModel = object;
                    var loadTime = Date.now() - startTime;

                    // Center and scale model
                    var box = new THREE.Box3().setFromObject(object);
                    var center = box.getCenter(new THREE.Vector3());
                    var size = box.getSize(new THREE.Vector3());

                    var maxDim = Math.max(size.x, size.y, size.z);
                    var scale = 3 / maxDim;
                    object.scale.multiplyScalar(scale);
                    object.position.sub(center.multiplyScalar(scale));

                    info.textContent = 'Loaded ' + format + ': ' + filename + ' (' + loadTime + 'ms)';
                },
                onError: function(error) {
                    info.textContent = 'Error loading ' + format + ': ' + error.message;
                    console.error('Error loading model:', error);
                },
                onProgress: function(loaded, total) {
                    if (total > 0) {
                        var percent = Math.round((loaded / total) * 100);
                        info.textContent = 'Loading ' + format + ': ' + percent + '%';
                    }
                }
            });
        }

        // Initialize on load
        window.addEventListener('load', init);
    </script>
</body>
</html>
